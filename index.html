<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FYNTAS — Barcode Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =============== DASHBOARD COLOR PALETTE =============== */
:root{
  --bg-dark: #0b1220;
  --bg-panel: #111b2e;
  --bg-panel2: #16223a;
  --border: #24314d;
  --text-main: #dbe4f5;
  --text-dim: #8493b0;
  
  --cyan: #35d0c0;
  --cyan-dim: #1c8e83;
  --gold: #d9ad52;
  --gold-bright: #f6d98a;
  --purple: #764ba2;
  --blue: #667eea;
  
  --radius: 10px;
  --font-display:'Oswald',sans-serif;
  --font-body:'Manrope',sans-serif;
  --font-mono:'Space Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-dark);
  color:var(--text-main);
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =============== DASHBOARD GRID BACKGROUND =============== */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(53,208,192,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(53,208,192,0.035) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* =============== GLASSMORPHIC LOGIN CARD =============== */
.login-wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  padding:20px;
}
.login-card{
  background: var(--bg-panel);
  backdrop-filter: blur(4px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px 25px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
  position:relative;
  overflow:hidden;
}
/* Glossy shine on card */
.login-card::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.02), transparent);
  transition:left 0.5s;
}
.login-card:hover::after{left:100%;}

.login-logo{
  display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:25px;
}
.brand-mark{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:20px;
  box-shadow:0 0 20px rgba(53,208,192,0.3);
}
.login-title{
  font-family:var(--font-display);font-size:22px;letter-spacing:.05em;font-weight:700;
  color:var(--text-main);
}
.login-title b{color:var(--gold-bright);}
.login-tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}

/* =============== FORM INPUTS =============== */
.field{margin-bottom:18px;}
.field label{
  display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:6px;font-weight:600;
}
input{
  width:100%;background:var(--bg-panel2);border:1px solid var(--border);
  color:var(--text-main);padding:12px 14px;border-radius:8px;
  font-family:var(--font-body);font-size:15px;outline:none;transition:.15s;
}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(53,208,192,0.15);}

/* =============== GLOSSY ANIMATED BUTTON =============== */
.btn-glossy{
  width:100%;padding:14px 0;border:none;border-radius:8px;font-weight:700;
  font-size:15px;font-family:var(--font-display);text-transform:uppercase;
  color:#fff;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
  box-shadow:0 4px 15px rgba(118,75,162,0.4);transition:all 0.3s ease;
}
.btn-glossy:hover{transform:scale(1.02);box-shadow:0 0 25px rgba(118,75,162,0.6);}
.btn-glossy::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition:left 0.5s;
}
.btn-glossy:hover::before{left:100%;}
.btn-glossy:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* =============== OTP BOXES =============== */
.otp-row{display:flex;gap:12px;justify-content:center;margin-top:5px;}
.box{
  width:55px;height:65px;border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg-panel2);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;transition:all 0.3s ease;
}
.box.filled{border-color:var(--cyan);box-shadow:0 0 15px rgba(53,208,192,0.2);}
.box input{
  width:100%;height:100%;background:transparent;border:0;outline:0;
  color:#fff;font-size:26px;font-weight:700;text-align:center;caret-color:var(--cyan);
}

.msg{padding:10px;border-radius:6px;font-size:13px;display:none;margin-bottom:12px;}
.msg.err{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);color:#ff6b6b;}
.msg.ok{background:rgba(53,208,192,0.1);border:1px solid rgba(53,208,192,0.3);color:var(--cyan);}

.resend-link{text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;margin-top:12px;display:block;}
.resend-link:hover{color:var(--cyan);}

/* ================= APP SHELL (DASHBOARD) ================= */
.app-shell{display:none;width:100%;max-width:1200px;padding:20px;height:100vh;overflow-y:auto;}

@media(max-width:480px){.login-card{padding:20px 15px;}}

/* =============== DASHBOARD STRUCTURE (If logged in) =============== */
.dash-header {
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:20px;
}
.dash-brand{font-family:var(--font-display);font-size:20px;color:var(--text-main);font-weight:600;}
.dash-brand b{color:var(--gold-bright);}
.dash-user{display:flex;align-items:center;gap:15px;color:var(--text-dim);font-size:13px;}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 16px;border-radius:6px;cursor:pointer;}
.logout-btn:hover{border-color:var(--cyan);color:var(--cyan);}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.stat-card .num{font-size:28px;font-weight:700;color:var(--cyan);}
.stat-card .lbl{color:var(--text-dim);font-size:12px;text-transform:uppercase;}

/* Generator Tab */
.card-panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:720px){.grid-2{grid-template-columns:1fr;}}
select{width:100%;background:var(--bg-panel2);border:1px solid var(--border);color:var(--text-main);padding:10px 12px;border-radius:6px;}
</style>
</head>
<body>

<!-- ================= LOGIN SCREEN (OTP) ================= -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="brand-mark">F</div>
      <div class="login-title">FYNTAS <b>Studio</b></div>
      <div class="login-tag">Verify with OTP</div>
    </div>
    
    <div class="msg err" id="loginMsg"></div>

    <!-- Step 1: Mobile -->
    <div id="stepMobile">
      <div class="field">
        <label>Mobile Number</label>
        <input type="text" id="loginMobile" placeholder="Enter 10-digit number" maxlength="10">
      </div>
      <button class="btn-glossy" id="otpSendBtn" onclick="sendOTP()">Send OTP</button>
    </div>

    <!-- Step 2: OTP -->
    <div id="stepOTP" style="display:none;">
      <div class="field">
        <label style="text-align:center;font-size:13px;">Enter 4-digit Code</label>
        <div class="otp-row" id="otpRow">
          <div class="box"><input maxlength="1" inputmode="numeric"></div>
          <div class="box"><input maxlength="1" inputmode="numeric"></div>
          <div class="box"><input maxlength="1" inputmode="numeric"></div>
          <div class="box"><input maxlength="1" inputmode="numeric"></div>
        </div>
      </div>
      <button class="btn-glossy" id="otpVerifyBtn" onclick="verifyOTP()">Verify & Sign In</button>
      <span class="resend-link" onclick="resendOTP()">Didn't receive? Resend</span>
    </div>
  </div>
</div>

<!-- ================= APP SCREEN (DASHBOARD) ================= -->
<div class="app-shell" id="appScreen">
  <div class="dash-header">
    <div class="dash-brand">FYNTAS <b>Barcode Studio</b></div>
    <div class="dash-user">
      <span id="whoami"></span>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:6px;">
    <button onclick="switchTab('generate')" style="background:none;border:none;color:var(--cyan);font-weight:bold;font-family:var(--font-display);font-size:16px;cursor:pointer;">Generate</button>
    <button onclick="switchTab('search')" style="background:none;border:none;color:var(--text-dim);font-family:var(--font-display);font-size:16px;cursor:pointer;">Search Stock</button>
  </div>

  <!-- Stats Row -->
  <div class="stats-row">
    <div class="stat-card"><div class="lbl">Total SKUs</div><div class="num" id="statTotal">0</div></div>
    <div class="stat-card"><div class="lbl">Total Quantity</div><div class="num" id="statQty">0</div></div>
    <div class="stat-card"><div class="lbl">Active Branches</div><div class="num" id="statBranches">0</div></div>
  </div>

  <!-- Generate Section -->
  <div id="sec-generate">
    <div class="card-panel">
      <h2 style="font-family:var(--font-display);color:var(--gold-bright);margin:0 0 10px;">New Product SKU</h2>
      <div class="msg err" id="genErr"></div>
      <div class="msg ok" id="genOk"></div>
      <div class="grid-2">
        <div class="field"><label>Product Name</label><input type="text" id="pName"></div>
        <div class="field"><label>Short Code</label><input type="text" id="pShort" maxlength="10"></div>
        <div class="field"><label>Variants (comma separated)</label><input type="text" id="pVariants" placeholder="Red, Blue, Green"></div>
        <div class="field"><label>Stock Quantity</label><input type="number" id="pQty" value="1"></div>
        <div class="field"><label>Price</label><input type="text" id="pPrice" placeholder="₹499"></div>
        <div class="field"><label>Copies to Print</label><input type="number" id="pCopies" value="1"></div>
        <div class="field"><label>Product Photo (optional)</label><input type="file" id="pPhoto" accept="image/*"></div>
      </div>
      <button class="btn-glossy" style="width:auto;padding:12px 30px;margin-top:10px;" id="genBtn" onclick="generateBarcodes()">➕ Generate SKU & Tags</button>
    </div>
    <div class="card-panel" id="resultCard" style="display:none;">
      <h2 style="font-family:var(--font-display);color:var(--cyan);margin:0 0 10px;">Generated Tags</h2>
      <button class="btn-glossy" style="width:auto;padding:8px 20px;font-size:13px;margin-bottom:15px;" onclick="window.print()">🖨️ Print All</button>
      <div id="printArea"><div class="label-sheet" id="labelSheet" style="display:flex;flex-wrap:wrap;gap:10px;padding:10px;background:#fff;border-radius:6px;"></div></div>
    </div>
  </div>

  <!-- Search Section -->
  <div id="sec-search" style="display:none;">
    <div class="card-panel">
      <div class="grid-2">
        <div class="field"><label>Search SKU / Name</label><input type="text" id="searchQ" placeholder="Search..."></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn-glossy" style="width:auto;padding:10px 25px;" onclick="doSearch()">🔍 Search</button></div>
      </div>
    </div>
    <div class="card-panel">
      <div id="searchResults"><p style="color:var(--text-dim);">Search to view inventory.</p></div>
    </div>
  </div>
</div>

<!-- ================= JAVASCRIPT ================= -->
<script>
const SUPABASE_URL = 'https://lngczljuuuelngfvjczm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZ2N6bGp1dXVlbG5nZnZqY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTAzMzIsImV4cCI6MjEwMjQ2NjMzMn0.UwX5iqMuizoN7sEumb24gTy4q0tObwMgWClzt6pE-DY';
const PHOTO_BUCKET = 'product-photos';
const OTP_FUNCTION_URL = "https://lngczljuuuelngfvjczm.supabase.co/functions/v1/send-otp";

let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let realOtp = "";
let currentUser = "";

// ================= OTP LOGIC =================
async function sendOTP() {
  const mobile = document.getElementById('loginMobile').value.trim();
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('otpSendBtn');

  msg.classList.remove('show');
  if(!mobile || mobile.length !== 10) {
    msg.textContent = 'Please enter a valid 10-digit mobile number.'; msg.classList.add('show'); return;
  }

  btn.innerHTML = 'Sending...'; btn.disabled = true;
  try {
    const res = await fetch(OTP_FUNCTION_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile })
    });
    const data = await res.json();
    if(data.status === 'success') {
      realOtp = data.otp; // OTP store kiya for frontend verification
      document.getElementById('stepMobile').style.display = 'none';
      document.getElementById('stepOTP').style.display = 'block';
    } else {
      msg.textContent = 'Failed: ' + data.message; msg.classList.add('show');
      btn.innerHTML = 'Send OTP'; btn.disabled = false;
    }
  } catch(e) {
    alert('Network Error. Ensure Edge Function is deployed.');
    btn.innerHTML = 'Send OTP'; btn.disabled = false;
  }
}

async function verifyOTP() {
  const inputs = document.querySelectorAll('#otpRow .box input');
  let enteredOtp = '';
  inputs.forEach(i => enteredOtp += i.value);
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('otpVerifyBtn');

  if(enteredOtp.length !== 4) {
    msg.textContent = 'Enter 4-digit OTP.'; msg.classList.add('show'); return;
  }

  if(enteredOtp === realOtp) {
    btn.innerHTML = 'Verifying...'; btn.disabled = true;
    setTimeout(() => {
      currentUser = document.getElementById('loginMobile').value;
      enterApp();
    }, 500);
  } else {
    msg.textContent = 'Incorrect OTP. Try again.'; msg.classList.add('show');
    inputs.forEach(i => { i.value = ''; i.parentElement.classList.remove('filled'); });
    inputs[0].focus();
  }
}

function resendOTP() {
  document.getElementById('stepOTP').style.display = 'none';
  document.getElementById('stepMobile').style.display = 'block';
  document.getElementById('loginMsg').classList.remove('show');
}

// ================= APP ENTRY =================
function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('whoami').textContent = '👤 ' + currentUser;
  loadStats();
}

function doLogout() {
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('stepOTP').style.display = 'none';
  document.getElementById('stepMobile').style.display = 'block';
  document.getElementById('loginMobile').value = '';
}

// ================= TABS =================
function switchTab(name) {
  document.getElementById('sec-generate').style.display = (name === 'generate') ? 'block' : 'none';
  document.getElementById('sec-search').style.display = (name === 'search') ? 'block' : 'none';
}

// ================= STATS =================
async function loadStats() {
  const { count } = await sb.from('products').select('*', { count: 'exact', head: true });
  document.getElementById('statTotal').textContent = count || 0;
  const { data: qtyData } = await sb.from('products').select('quantity');
  let totalQty = 0; qtyData.forEach(i => totalQty += i.quantity || 0);
  document.getElementById('statQty').textContent = totalQty;
}

// ================= GENERATE SKU =================
async function generateBarcodes() {
  const err = document.getElementById('genErr'); err.classList.remove('show');
  const ok = document.getElementById('genOk'); ok.classList.remove('show');
  const name = document.getElementById('pName').value.trim();
  if(!name) { err.textContent='Product name required.'; err.classList.add('show'); return; }

  const short = document.getElementById('pShort').value.trim().toUpperCase() || name.slice(0,5).toUpperCase();
  const variantsRaw = document.getElementById('pVariants').value.trim();
  const variantList = variantsRaw ? variantsRaw.split(',').map(v=>v.trim()).filter(Boolean) : [''];
  const qty = parseInt(document.getElementById('pQty').value) || 0;
  const copies = parseInt(document.getElementById('pCopies').value) || 1;
  const price = document.getElementById('pPrice').value.trim();
  const photoFile = document.getElementById('pPhoto').files[0];
  const btn = document.getElementById('genBtn');

  btn.innerHTML = 'Working...'; btn.disabled = true;

  let photoUrl = '';
  if(photoFile) {
    const path = `products/${Date.now()}.jpg`;
    await sb.storage.from(PHOTO_BUCKET).upload(path, photoFile);
    photoUrl = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  const results = [];
  for(const variant of variantList) {
    const vSlug = variant.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const baseSku = ['FYN', short, vSlug].filter(Boolean).join('-');
    const lot = Math.floor(Math.random() * 9000 + 1000);
    const sku = baseSku + '-' + lot;

    const row = { sku, product_name:name, short_name:short, variant, lot, price, photo_url:photoUrl, quantity:qty };
    await sb.from('products').insert(row);
    results.push({sku, variant});
  }

  renderTags(results, {name, price}, copies);
  ok.textContent = `${results.length} SKUs generated successfully!`;
  ok.classList.add('show');
  btn.innerHTML = 'Generate SKU'; btn.disabled = false;
  loadStats();
}

function renderTags(skuResults, meta, copies) {
  document.getElementById('resultCard').style.display='block';
  const sheet = document.getElementById('labelSheet'); sheet.innerHTML='';
  skuResults.forEach((row) => {
    for(let c=0;c<copies;c++) {
      const tag = document.createElement('div');
      tag.style.cssText = 'background:#fdf9f0;color:#141210;border-radius:6px;padding:8px 6px;text-align:center;min-width:60px;';
      let html = `<div style="font-family:var(--font-display);font-size:8px;color:#8a7a55;text-transform:uppercase;">FYNTAS</div>`;
      html += `<div style="font-size:9px;font-weight:bold;">${meta.name}${row.variant ? ' · '+row.variant : ''}</div>`;
      html += `<div style="font-size:7px;color:#7a6b48;">SKU: ${row.sku}</div>`;
      html += `<canvas id="bc-${row.sku}-${c}"></canvas>`;
      html += `<canvas id="qr-${row.sku}-${c}" style="width:40px;height:40px;"></canvas>`;
      html += `<div style="font-size:8px;">${meta.price || ''}</div>`;
      tag.innerHTML = html; sheet.appendChild(tag);
      JsBarcode(`#bc-${row.sku}-${c}`, row.sku, {format:'CODE128', displayValue:false, height:30, width:2, margin:2});
      QRCode.toCanvas(document.getElementById(`qr-${row.sku}-${c}`), window.location.origin + '/view.html?sku=' + row.sku, {width:40, margin:1});
    }
  });
}

// ================= SEARCH =================
async function doSearch() {
  const q = document.getElementById('searchQ').value.trim();
  const wrap = document.getElementById('searchResults');
  wrap.innerHTML = 'Searching...';
  let query = sb.from('products').select('*').limit(100);
  if(q) query = query.or(`sku.ilike.%${q}%,product_name.ilike.%${q}%`);
  const {data, error} = await query;
  if(error) { wrap.innerHTML = error.message; return; }
  if(!data.length) { wrap.innerHTML = '<p style="color:var(--text-dim);">No products found.</p>'; return; }
  wrap.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:13px;color:var(--text-main);">
    <tr><th style="text-align:left;border-bottom:1px solid var(--border);padding:8px;">SKU</th><th>Product</th><th>Qty</th></tr>
    ${data.map(r => `<tr><td style="padding:8px;border-bottom:1px solid var(--border);font-family:monospace;color:var(--cyan);">${r.sku}</td><td>${r.product_name}</td><td>${r.quantity}</td></tr>`).join('')}
  </table>`;
}
</script>
</body>
</html>
