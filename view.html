<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FYNTAS — Product View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Manrope:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0b1220;
      --bg-panel: #111b2e;
      --bg-panel2: #16223a;
      --border: #24314d;
      --text-main: #dbe4f5;
      --text-dim: #8493b0;
      --cyan: #35d0c0;
      --gold-bright: #f6d98a;
      --purple: #764ba2;
      --blue: #667eea;
    }
    *{ box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(53,208,192,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(53,208,192,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .photo-wrap {
      width: 100%;
      aspect-ratio: 1/1;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-wrap .noimg {
      color: var(--text-dim);
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
    .content {
      padding: 22px 22px 26px;
    }
    .brand {
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 4px;
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 2px;
      line-height: 1.2;
      color: var(--gold-bright);
    }
    .variant {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .price {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      color: var(--cyan);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 4px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      gap: 10px;
    }
    .meta-row span:first-child {
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .meta-row span:last-child {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      text-align: right;
      word-break: break-all;
      color: var(--text-main);
    }
    .sku-code {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--gold-bright);
      text-align: center;
      margin-top: 16px;
      letter-spacing: 0.03em;
      word-break: break-all;
      background: var(--bg-panel2);
      padding: 8px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }
    .state {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 15px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--cyan);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f87171; }
    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 16px;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="state" id="state">
      <div class="spinner"></div>
      Loading product…
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://lngczljuuuelngfvjczm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZ2N6bGp1dXVlbG5nZnZqY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTAzMzIsImV4cCI6MjEwMjQ2NjMzMn0.UwX5iqMuizoN7sEumb24gTy4q0tObwMgWClzt6pE-DY';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function qs(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    async function loadProduct() {
      const sku = qs('sku') || qs('code'); // support both
      const stateEl = document.getElementById('state');
      if (!sku) {
        stateEl.innerHTML = '<span class="err">❌ Invalid QR — SKU missing.</span>';
        return;
      }
      try {
        const { data, error } = await sb
          .from('products')
          .select('*')
          .eq('sku', sku)
          .single();

        if (error || !data) {
          throw new Error('Product not found in our system.');
        }
        renderProduct(data);
      } catch (e) {
        stateEl.innerHTML = `<span class="err">⚠️ ${e.message || 'Something went wrong.'}</span>`;
      }
    }

    function renderProduct(p) {
      const card = document.getElementById('card');
      const photoHtml = p.photo_url
        ? `<img src="${p.photo_url}" alt="${p.product_name}">`
        : `<div class="noimg">📷 No photo uploaded</div>`;

      // Format date
      const created = p.created_at ? new Date(p.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';

      card.innerHTML = `
        <div class="photo-wrap">${photoHtml}</div>
        <div class="content">
          <div class="brand">FYNTAS · ${p.category || ''}${p.sub_category ? ' / ' + p.sub_category : ''}${p.store ? ' · ' + p.store : ''}</div>
          <h1>${p.product_name || ''}</h1>
          ${p.variant ? `<div class="variant">${p.variant}</div>` : ''}
          ${p.price ? `<div class="price">${p.price}</div>` : ''}
          <div class="meta">
            <div class="meta-row"><span>Stock Quantity</span><span>${p.quantity ?? '—'}</span></div>
            <div class="meta-row"><span>Branch</span><span>${p.store || '—'}</span></div>
            <div class="meta-row"><span>Category</span><span>${p.category || '—'}</span></div>
            <div class="meta-row"><span>Sub-category</span><span>${p.sub_category || '—'}</span></div>
            <div class="meta-row"><span>Added on</span><span>${created}</span></div>
          </div>
          <div class="sku-code">${p.sku}</div>
        </div>
        <div class="footer">FYNTAS · Smart Inventory</div>
      `;
    }

    loadProduct();
  </script>
</body>
</html>
