<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Product View</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0b1220;color:#dbe4f5;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{background:#111b2e;border:1px solid #24314d;border-radius:10px;padding:24px;max-width:400px;width:100%;text-align:center;}
img{max-width:100%;border-radius:8px;margin:15px 0;max-height:280px;background:#000;}
h2{color:#f6d98a;}.sku{color:#8493b0;font-family:monospace;font-size:14px;}</style>
</head>
<body>
<div class="card"><h2>FYNTAS</h2><div id="content"><p>Loading...</p></div></div>
<script>
const sb = supabase.createClient('https://lngczljuuuelngfvjczm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZ2N6bGp1dXVlbG5nZnZqY3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTAzMzIsImV4cCI6MjEwMjQ2NjMzMn0.UwX5iqMuizoN7sEumb24gTy4q0tObwMgWClzt6pE-DY');
async function load(){const sku=new URLSearchParams(window.location.search).get('sku');const c=document.getElementById('content');
if(!sku){c.innerHTML='<p class="sku">Invalid QR</p>';return;}
const{data,error}=await sb.from('products').select('*').eq('sku',sku).single();
if(error||!data){c.innerHTML=`<p class="sku">Product ${sku} not found</p>`;return;}
c.innerHTML=(data.photo_url?`<img src="${data.photo_url}">`:'<div style="background:#111;padding:20px;border-radius:8px;color:#555;">No Photo</div>')+
`<h2>${data.product_name}</h2><p class="sku">SKU: ${data.sku}</p><p>${data.price||''}</p>`;
}load();
</script>
</body>
</html>
